<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>404 — Darina Mikhalina</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#711a32">

    <style>
        /* Inter */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/inter-v20-latin-regular.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('/fonts/inter-v20-latin-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('/fonts/inter-v20-latin-600.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/fonts/inter-v20-latin-700.woff2') format('woff2');
        }

        /* Reenie Beanie */
        @font-face {
            font-family: 'Reenie Beanie';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/reenie-beanie-v22-latin-regular.woff2') format('woff2');
        }

        :root {
            --bg: #f5f5f5;
            --ink: #1c1918;
            --muted: #756e69;
            --line: #dbd3ce;
            --wine: #711a32;
            --beige: #e0d8d2;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            max-width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; transition: 0.2s; }
        ::selection { background: var(--wine); color: #fff; }
        img, video { max-width: 100%; height: auto; display: block; }

        .wrap { width: 90%; max-width: 600px; margin: 0 auto; }

        /* SIMPLE NAV */
        .nav {
            padding: 20px 0;
            text-align: center;
        }
        .logo {
            font-family: 'Reenie Beanie', cursive; font-size: 48px;
            color: var(--wine); line-height: 1; text-decoration: none; font-weight: bold;
            display: inline-block;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .logo:hover { color: #591326; transform: scale(1.05); }

        /* 404 CONTENT */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 0 60px;
        }
        .pig-img {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .error-code {
            font-size: clamp(60px, 15vw, 100px);
            font-weight: 700;
            color: var(--wine);
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0;
        }
        .error-subtitle {
            font-family: 'Reenie Beanie', cursive;
            font-size: clamp(28px, 6vw, 40px);
            color: var(--wine);
            font-weight: 700;
            line-height: 1.1;
            margin: 10px 0 20px;
        }
        .error-text {
            font-size: 18px;
            color: #57514e;
            margin: 0 0 40px;
            line-height: 1.6;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
        }
        .btn-home {
            display: inline-block;
            padding: 16px 48px;
            background-color: var(--wine);
            color: #fff;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.1em;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            text-align: center;
            box-shadow: 0 4px 12px rgba(113, 26, 50, 0.2);
        }
        .btn-home:hover {
            background-color: #591326;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(113, 26, 50, 0.3);
        }
        .btn-home:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(113, 26, 50, 0.3);
        }
        .link-portfolio {
            font-size: 13px;
            font-weight: 600;
            color: var(--wine);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 2px solid var(--wine);
            padding-bottom: 4px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .link-portfolio:hover {
            color: #591326;
            border-color: #591326;
        }

        @media(max-width:600px) {
            .btn-home { width: 100%; padding: 16px 20px; }
            .error-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <header class="nav">
        <div class="wrap">
            <a class="logo" href="/">DM</a>
        </div>
    </header>

    <main class="content wrap">
        <img src="pig.png" width="150" height="150" alt="Flying pig illustration" class="pig-img">
        
        <h1 class="error-code">404</h1>
        <div class="error-subtitle">This pig flew too far.</div>
        
        <p class="error-text">
            Looks like this page got carried away.<br>
            Let’s get you back on track.
        </p>

        <div class="buttons">
            <a href="/" class="btn-home">Back to Home</a>
            <a href="/media/darina_mikhalina_portfolio.pdf" target="_blank" rel="noopener" class="link-portfolio">Download my portfolio</a>
        </div>
    </main>

</body>
</html>
